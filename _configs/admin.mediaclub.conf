# vi:syntax=nginx

server {
  listen 80;
  server_name admin.mediaclub.com;
  location / {
    return 301 https://$server_name$request_uri;
  }
  location /.well-known/ {
    root /home/mediaclub/mediaclub.com/admin/www;
  }
}

server {
    #listen 80;
    listen 443 ssl http2;
    server_name admin.mediaclub.com;
    charset utf-8;
    access_log /var/log/nginx/admin.media_access.log main;
    root /home/mediaclub/mediaclub.com/admin/www;
    ssl_trusted_certificate /etc/letsencrypt/live/admin.mediaclub.com/chain.pem;
    ssl_certificate /etc/letsencrypt/live/admin.mediaclub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.mediaclub.com/privkey.pem;

    location / {
        index index.php index.html;
        try_files $uri $uri/ /index.php?$args;
        error_page 403 /index.php?$args;
        error_page 404 /index.php?$args;
    }

    location ~ ^/(protected|framework|themes/\w+/views) {
        deny all;
    }

    # отключаем обработку запросов фреймворком к несуществующим статичным файлам
    #location ~ \.(js|css|png|jpg|gif|swf|ico|pdf|mov|fla|zip|rar)$ {
    #    try_files $uri =404;
    #}

    # передаем PHP-скрипт серверу FastCGI, прослушивающему адрес 127.0.0.1:9000
    location ~ \.php {
        fastcgi_split_path_info ^(.+\.php)(.*)$;
        # позволяем yii перехватывать запросы к несуществующим PHP-файлам
        set $fsn /index.php;
        if (-f $document_root$fastcgi_script_name) {
            set $fsn $fastcgi_script_name;
        }

        fastcgi_pass 127.0.0.1:9000;
        #fastcgi_pass unix:/var/run/php54-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fsn;

        # PATH_INFO и PATH_TRANSLATED могут быть опущены, но стандарт RFC 3875 определяет для CGI
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fsn;
    }

    location /mfiles {
        root /opt;
        add_header Content-type application/octet-stream;
        internal;
        error_page 404 /index.php?$args;
    }

    location ~* /\.(?!well-known\/) {
        deny all;
        access_log off;
        log_not_found off;
    }
}


