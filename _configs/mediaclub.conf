# -- HTTP 80 --
# -- TLS (HTTPS/443) --
server {
    listen 443 ssl http2;
    server_name www.mediaclub.com;
    set $SiteBrand "media";
    charset utf-8;
    root /home/mediaclub/mediaclub.com/site/www;
    ssl_trusted_certificate /etc/letsencrypt/live/www.mediaclub.com/chain.pem;
    ssl_certificate /etc/letsencrypt/live/www.mediaclub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.mediaclub.com/privkey.pem;

    access_log /var/log/nginx/media_access.log main;
    error_log /var/log/nginx/media_error.log;

    # do not permit bed referers
    if ($permit = "0") {
        return 500;
    }

    location / {
        index index.php index.html;
        try_files $uri $uri/ /index.php?$args;
        error_page 403 /index.php?$args;
        error_page 404 /index.php?$args;
        error_page 503 /maintenance.php;
        if (-f $document_root/maintenance) {
            return 503;
        }
    }

    location ~ ^/(protected|framework|themes/\w+/views) {
        internal; # 404 dir/file security
        deny all;
    }

    # отключаем обработку запросов фреймворком к несуществующим статичным файлам
    #location ~ \.(js|css|png|jpg|gif|swf|ico|pdf|mov|fla|zip|rar)$ {
    #    try_files $uri =404;
    #}

    #capcha rule
    location ^/captcha/display/.+\.jpg$ {
        try_files $uri $uri/ /index.php?$args;
        access_log /var/log/nginx/$SiteBrand.capcha.access.log main;
    }

    # for alb and art if not found replace blank
    location ~/images/(art|alb/c)?.+\.(jpe?g|gif)$ {
        #access_log off;
        expires 30d;
        access_log /var/log/nginx/$SiteBrand.cover200.access.log main;
        if (!-f $request_filename) {
            #rewrite ^/urls/(.*)\.png$ "http://webo.in/i/image.php?url=$1" break;
            rewrite ^ "/images/splash-big.png" break;
        }
    }

    #for alb and art if not found replace blank
    location ~/images/(alb/|alb/t)?.+\.(jpe?g|gif)$ {
        #access_log off;
        expires 30d;
        access_log /var/log/nginx/$SiteBrand.cover200.access.log main;
        if (!-f $request_filename) {
            #rewrite ^/urls/(.*)\.png$ http://webo.in/i/image.php?url=$1 break;
            rewrite ^ "/images/splash-small.png" break;
        }
    }


    # отключаем обработку запросов фреймворком к несуществующим статичным файлам
    location ~* \.(js|css|png|gif|swf|ico|pdf|mov|fla|zip|rar)$ {
        try_files $uri =404; #/index.php?$args;
        #try_files $uri $uri/ /index.php?$args;
        access_log /var/log/nginx/$SiteBrand.static.access.log main;
        expires 30d;
    }


    #location ~* \.mp3$ {
    #  try_files $uri $uri/ /index.php?$args;
    #}


    # передаем PHP-скрипт серверу FastCGI
    location ~ \.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(.*)$;
        #fastcgi_pass unix:/var/run/php54-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fsn; 
        # PATH_INFO и PATH_TRANSLATED могут быть опущены,
        # но стандарт RFC 3875 определяет для CGI 
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fsn;
        # позволяем yii перехватывать запросы к несуществующим PHP-файлам
        set $fsn /index.php;
        if (-f $document_root$fastcgi_script_name) {
            set $fsn $fastcgi_script_name;
        }
    }

    location /mfiles {
        root /opt/www;
        internal;
        error_page 404 /index.php?$args;
        add_header Content-type application/octet-stream;
    }
    # location /.well-known/ { root /etc/letsencrypt/www; }
    # все кроме letsencrypt (/.well-known/*)
    location ~* /\.(?!well-known\/) {
        access_log off;
        log_not_found off;
        deny all;
    }
}

